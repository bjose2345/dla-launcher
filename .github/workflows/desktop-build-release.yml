name: Desktop builds and releases

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  TAURI_CLI_VERSION: 2.11.4

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (DEB and RPM)
            runner: ubuntu-22.04
            bundles: deb,rpm
            artifact-name: dla-launcher-linux-x86_64
            artifact-paths: |
              tauri2/target/release/bundle/deb/*.deb
              tauri2/target/release/bundle/rpm/*.rpm
          - name: Windows x86_64 (MSI and NSIS)
            runner: windows-2022
            bundles: msi,nsis
            artifact-name: dla-launcher-windows-x86_64
            artifact-paths: |
              tauri2/target/release/bundle/msi/*.msi
              tauri2/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            p7zip-full

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable the pinned pnpm version
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tauri2 -> target

      - name: Install the pinned Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: Prepare the MSI version override
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @'
          const { version } = require("./package.json");
          const match = version.match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/);
          if (!match) throw new Error(`Invalid application version: ${version}`);

          const [, major, minor, patch, prerelease] = match;
          if (Number(major) > 255 || Number(minor) > 255 || Number(patch) > 65535) {
            throw new Error(`Application version is outside the MSI version range: ${version}`);
          }

          let build = 65535;
          if (prerelease) {
            const conventional = prerelease.match(/^(alpha|beta|rc)\.(\d+)$/);
            const numeric = prerelease.match(/^\d+$/);
            if (conventional) {
              const sequence = Number(conventional[2]);
              if (sequence > 9999) throw new Error(`Prerelease sequence is too large for MSI: ${version}`);
              build = { alpha: 10000, beta: 20000, rc: 30000 }[conventional[1]] + sequence;
            } else if (numeric && Number(prerelease) < 40000) {
              build = Number(prerelease);
            } else {
              let hash = 2166136261;
              for (const byte of Buffer.from(prerelease)) {
                hash ^= byte;
                hash = Math.imul(hash, 16777619) >>> 0;
              }
              build = 40000 + (hash % 25535);
            }
          }

          process.stdout.write(`${major}.${minor}.${patch}.${build}`);
          '@

          $msiVersion = $script | node
          $config = @{
            bundle = @{
              windows = @{
                wix = @{ version = $msiVersion }
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 tauri2/tauri.windows-ci.conf.json
          Write-Host "Using MSI package version $msiVersion for application version $((Get-Content package.json | ConvertFrom-Json).version)."

      - name: Build Linux release bundles
        if: runner.os == 'Linux'
        working-directory: tauri2
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Build Windows release bundles
        if: runner.os == 'Windows'
        working-directory: tauri2
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }} --config tauri.windows-ci.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify tag matches the application version
        shell: bash
        run: |
          expected_tag="v$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json ($expected_tag)." >&2
            exit 1
          fi

      - name: Download desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: dla-launcher-*
          path: downloaded-assets

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            release_name="${name// /-}"
            if [[ -e "release-assets/$release_name" ]]; then
              echo "Duplicate release asset name: $release_name" >&2
              exit 1
            fi
            cp "$asset" "release-assets/$release_name"
          done < <(find downloaded-assets -type f -print0)

          if ! compgen -G 'release-assets/*' > /dev/null; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          source_prefix="DLA-Launcher-${version}/"
          git archive \
            --format=zip \
            --prefix="$source_prefix" \
            --output="release-assets/DLA-Launcher_${version}_source.zip" \
            "$GITHUB_SHA"
          git archive \
            --format=tar \
            --prefix="$source_prefix" \
            "$GITHUB_SHA" \
            | gzip -9 -n > "release-assets/DLA-Launcher_${version}_source.tar.gz"

          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Prepare the public release manifest
        shell: bash
        run: |
          mkdir r2-metadata
          node .github/scripts/create-release-manifest.mjs \
            release-assets \
            r2-metadata/latest.json \
            "$GITHUB_REF_NAME" \
            "https://downloads.dlsitearchive.com" \
            "$GITHUB_SHA"

      - name: Preserve finalized assets for R2 publication
        uses: actions/upload-artifact@v7
        with:
          name: dla-launcher-r2-release
          path: |
            release-assets
            r2-metadata/latest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)

          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            release_flags=(
              --verify-tag
              --generate-notes
              --title "DLA Launcher $GITHUB_REF_NAME"
              --draft
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_flags[@]}"
          fi

          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" "$asset" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload attempt $attempt failed for $(basename "$asset")." >&2
              sleep $((attempt * 5))
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload $(basename "$asset") after three attempts." >&2
              exit 1
            fi
          done

          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == true ]]; then
            publish_flags=(--draft=false)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              publish_flags+=(--prerelease)
            fi
            gh release edit "$GITHUB_REF_NAME" "${publish_flags[@]}"
          fi

  publish-r2:
    name: Publish current release to R2
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: r2-production
    permissions:
      contents: read
    concurrency:
      group: dla-launcher-r2-production
      cancel-in-progress: false

    steps:
      - name: Download finalized release assets
        uses: actions/download-artifact@v8
        with:
          name: dla-launcher-r2-release
          path: r2-publication

      - name: Install the pinned AWS CLI
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            --user \
            awscli==1.46.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload, verify, and promote the current release
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          AWS_MAX_ATTEMPTS: 5
          AWS_RETRY_MODE: standard
          R2_ENDPOINT: ${{ secrets.R2_RELEASES_ENDPOINT }}
          R2_BUCKET: dla-launcher
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing R2_RELEASES_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_RELEASES_SECRET_ACCESS_KEY}"
          : "${R2_ENDPOINT:?Missing R2_RELEASES_ENDPOINT}"
          R2_ENDPOINT="${R2_ENDPOINT%/}"

          current_tag="$GITHUB_REF_NAME"
          if [[ ! "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsafe release tag: $current_tag" >&2
            exit 1
          fi

          assets_dir="r2-publication/release-assets"
          manifest="r2-publication/r2-metadata/latest.json"
          manifest_tag="$(node --print "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).tag" "$manifest")"
          if [[ "$manifest_tag" != "$current_tag" ]]; then
            echo "Manifest tag $manifest_tag does not match $current_tag." >&2
            exit 1
          fi

          mkdir r2-verification
          previous_tag=""
          if aws s3 cp \
            "s3://$R2_BUCKET/latest.json" \
            r2-verification/previous-latest.json \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors; then
            # The single-quoted program is JavaScript, so shell expansion is intentionally disabled.
            # shellcheck disable=SC2016
            previous_tag="$(node -e '
              const fs = require("fs");
              const tag = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).tag;
              if (!/^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) {
                throw new Error(`Unsafe previous release tag: ${tag}`);
              }
              process.stdout.write(tag);
            ' r2-verification/previous-latest.json)"
          fi

          content_type() {
            case "$1" in
              *.tar.gz) echo "application/gzip" ;;
              *.zip) echo "application/zip" ;;
              *.rpm) echo "application/x-rpm" ;;
              *.deb) echo "application/vnd.debian.binary-package" ;;
              *.msi) echo "application/x-msi" ;;
              *.exe) echo "application/vnd.microsoft.portable-executable" ;;
              *.txt) echo "text/plain; charset=utf-8" ;;
              *) echo "application/octet-stream" ;;
            esac
          }

          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            key="releases/$current_tag/$name"
            aws s3 cp \
              "$asset" \
              "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --only-show-errors \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "$(content_type "$name")" \
              --content-disposition "attachment; filename=\"$name\""
          done < <(find "$assets_dir" -maxdepth 1 -type f -print0 | sort -z)

          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            key="releases/$current_tag/$name"
            expected_size="$(stat --format='%s' "$asset")"
            remote_size="$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --query ContentLength \
              --output text)"
            if [[ "$remote_size" != "$expected_size" ]]; then
              echo "R2 size mismatch for $name: expected $expected_size, received $remote_size." >&2
              exit 1
            fi

            aws s3 cp \
              "s3://$R2_BUCKET/$key" \
              "r2-verification/$name" \
              --endpoint-url "$R2_ENDPOINT" \
              --only-show-errors
            expected_sha="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            actual_sha="$(sha256sum "r2-verification/$name" | cut -d ' ' -f 1)"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "R2 checksum mismatch for $name." >&2
              exit 1
            fi
          done < <(find "$assets_dir" -maxdepth 1 -type f -print0 | sort -z)

          aws s3 cp \
            "$manifest" \
            "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors \
            --cache-control "no-store" \
            --content-type "application/json; charset=utf-8"
          aws s3 cp \
            "s3://$R2_BUCKET/latest.json" \
            r2-verification/published-latest.json \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors
          cmp --silent "$manifest" r2-verification/published-latest.json

          if [[ -n "$previous_tag" && "$previous_tag" != "$current_tag" ]]; then
            aws s3 rm \
              "s3://$R2_BUCKET/releases/$previous_tag/" \
              --recursive \
              --endpoint-url "$R2_ENDPOINT" \
              --only-show-errors
          fi
