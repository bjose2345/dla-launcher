name: Desktop builds and releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  TAURI_CLI_VERSION: 2.11.4

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (DEB and RPM)
            runner: ubuntu-22.04
            bundles: deb,rpm
            artifact-name: dla-launcher-linux-x86_64
            artifact-paths: |
              tauri2/target/release/bundle/deb/*.deb
              tauri2/target/release/bundle/rpm/*.rpm
          - name: Windows x86_64 (MSI and NSIS)
            runner: windows-2022
            bundles: msi,nsis
            artifact-name: dla-launcher-windows-x86_64
            artifact-paths: |
              tauri2/target/release/bundle/msi/*.msi
              tauri2/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            p7zip-full

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable the pinned pnpm version
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tauri2 -> target

      - name: Install the pinned Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: Prepare the MSI version override
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @'
          const { version } = require("./package.json");
          const match = version.match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/);
          if (!match) throw new Error(`Invalid application version: ${version}`);

          const [, major, minor, patch, prerelease] = match;
          if (Number(major) > 255 || Number(minor) > 255 || Number(patch) > 65535) {
            throw new Error(`Application version is outside the MSI version range: ${version}`);
          }

          let build = 65535;
          if (prerelease) {
            const conventional = prerelease.match(/^(alpha|beta|rc)\.(\d+)$/);
            const numeric = prerelease.match(/^\d+$/);
            if (conventional) {
              const sequence = Number(conventional[2]);
              if (sequence > 9999) throw new Error(`Prerelease sequence is too large for MSI: ${version}`);
              build = { alpha: 10000, beta: 20000, rc: 30000 }[conventional[1]] + sequence;
            } else if (numeric && Number(prerelease) < 40000) {
              build = Number(prerelease);
            } else {
              let hash = 2166136261;
              for (const byte of Buffer.from(prerelease)) {
                hash ^= byte;
                hash = Math.imul(hash, 16777619) >>> 0;
              }
              build = 40000 + (hash % 25535);
            }
          }

          process.stdout.write(`${major}.${minor}.${patch}.${build}`);
          '@

          $msiVersion = $script | node
          $config = @{
            bundle = @{
              windows = @{
                wix = @{ version = $msiVersion }
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 tauri2/tauri.windows-ci.conf.json
          Write-Host "Using MSI package version $msiVersion for application version $((Get-Content package.json | ConvertFrom-Json).version)."

      - name: Build Linux release bundles
        if: runner.os == 'Linux'
        working-directory: tauri2
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Build Windows release bundles
        if: runner.os == 'Windows'
        working-directory: tauri2
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }} --config tauri.windows-ci.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify tag matches the application version
        shell: bash
        run: |
          expected_tag="v$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json ($expected_tag)." >&2
            exit 1
          fi

      - name: Download desktop installers
        uses: actions/download-artifact@v5
        with:
          pattern: dla-launcher-*
          path: downloaded-assets

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp "$asset" "release-assets/$name"
          done < <(find downloaded-assets -type f -print0)

          if ! compgen -G 'release-assets/*' > /dev/null; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi

          release_flags=(
            --verify-tag
            --generate-notes
            --title "DLA Launcher $GITHUB_REF_NAME"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create \
            "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            "${release_flags[@]}"
