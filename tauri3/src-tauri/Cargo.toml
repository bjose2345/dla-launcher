[package]
name = "dla-launcher-chromium"
version.workspace = true
description = "Open-source library for your DLsite works (experimental Chromium build)"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
# The launcher's own build script and code, shared with tauri2/src-tauri; the
# `chromium` feature switches the few places that differ (src/chromium.rs there).
build = "../../tauri2/src-tauri/build.rs"

[lib]
name = "dla_launcher_tauri"
path = "../../tauri2/src-tauri/src/lib.rs"

[[bin]]
name = "dla-launcher-chromium"
path = "src/main.rs"

[features]
default = ["chromium"]
chromium = []

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
dla-archive.workspace = true
dla-application.workspace = true
dla-android-package-tauri.workspace = true
dla-catalog-import.workspace = true
dla-catalog.workspace = true
dla-cover-cache.workspace = true
dla-domain.workspace = true
dla-game-translation.workspace = true
dla-launch.workspace = true
dla-media.workspace = true
dla-scanner.workspace = true
dla-search-tantivy.workspace = true
dla-sqlite.workspace = true
dla-translation-relay.workspace = true
dla-translator.workspace = true
log = "=0.4.34"
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
zip.workspace = true
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.7"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.3"
tauri-plugin-deep-link = "=3.0.0-alpha.3"
tauri-plugin-log = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
dla-connector.workspace = true
dla-delivery.workspace = true
zeroize.workspace = true
# The desktop portal's file dialogs: the default GTK 3 ones cannot share a
# process with the GTK 4 that the CEF runtime uses.
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "=3.0.0-alpha.3"

# glib-sys removes Chromium's idle GLib work source (src/chromium.rs); dirs
# finds the cache directory for the development build's own Chromium profile.
[target.'cfg(target_os = "linux")'.dependencies]
dirs = "=6.0.0"
glib-sys = "=0.22.9"
libc.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
