[package]
name = "dla-launcher-tauri"
version.workspace = true
description = "Open-source library for your DLsite works"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "dla_launcher_tauri"
# rlib for the desktop binary, cdylib for the Android build. The staticlib an
# iOS build would need is left out until there is one: every dev build wrote
# it anew as a 2 GB archive.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
dla-archive.workspace = true
dla-application.workspace = true
dla-android-package-tauri.workspace = true
dla-catalog-import.workspace = true
dla-catalog.workspace = true
dla-cover-cache.workspace = true
dla-domain.workspace = true
dla-game-translation.workspace = true
dla-launch.workspace = true
dla-media.workspace = true
dla-scanner.workspace = true
dla-search-tantivy.workspace = true
dla-sqlite.workspace = true
dla-translation-relay.workspace = true
dla-translator.workspace = true
log = "=0.4.34"
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
zip.workspace = true
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
dla-connector.workspace = true
dla-delivery.workspace = true
zeroize.workspace = true
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
libc.workspace = true
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
# tauri3/ builds this crate's code with Tauri 3 and Chromium (CEF) through its
# `chromium` feature (src/chromium.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("chromium"))'] }
